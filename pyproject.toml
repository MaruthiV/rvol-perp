[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rvol"
version = "0.1.0"
description = "Realized volatility perpetual index — research library"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.2",
    "pandas>=2.2",
    "pyarrow>=21.0",
    "scipy>=1.15",
    "hyperliquid-python-sdk>=0.22",
    "python-binance>=1.0.19",
    "ccxt>=4.5",
    "arch>=8.0",
    "numba>=0.61",
    "matplotlib>=3.10",
    "tqdm",
]

[project.optional-dependencies]
jax = [
    "jax[cpu]>=0.4.30",
    "jaxlib>=0.4.30",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "black>=25.1",
    "ruff>=0.9",
    "mypy>=1.15",
    "hypothesis>=6.130",
]

[tool.hatch.build.targets.wheel]
packages = ["rvol"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
